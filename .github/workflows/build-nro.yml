name: Build Nintendo Switch NRO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Versao temporaria para testar o auto-updater (ex.: 0.9.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build NRO
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"

      - name: Validate test version
        if: inputs.version_override != ''
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: '[[ "$VERSION_OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Build
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            make -j2 APP_VERSION="$VERSION_OVERRIDE" APP_TITLE="Vitrine Updater Test"
          else
            make -j2
          fi

      - name: Validate NRO
        shell: bash
        run: |
          test -s switch-vitrine.nro
          test "$(dd if=switch-vitrine.nro bs=1 skip=16 count=4 2>/dev/null)" = "NRO0"

      - name: Package
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            OUTPUT_NAME="vitrine-updater-test"
            INSTALL_DIR="vitrine-updater-test"
          else
            OUTPUT_NAME="switch-vitrine"
            INSTALL_DIR="switch-vitrine"
          fi
          mkdir -p "dist/package/switch/$INSTALL_DIR"
          cp switch-vitrine.nro "dist/$OUTPUT_NAME.nro"
          cp switch-vitrine.nro "dist/package/switch/$INSTALL_DIR/$OUTPUT_NAME.nro"
          sha256sum "dist/$OUTPUT_NAME.nro" > "dist/$OUTPUT_NAME.nro.sha256"
          cd dist/package
          zip -r9 "../$OUTPUT_NAME.zip" switch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-vitrine-${{ inputs.version_override || github.sha }}
          path: |
            dist/*.nro
            dist/*.nro.sha256
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: switch-vitrine-${{ inputs.version_override || github.sha }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Vitrine ${GITHUB_REF_NAME#v}"
          --generate-notes
          --verify-tag
